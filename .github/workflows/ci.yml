name: Pull request checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  LC_ALL: C.UTF-8
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  TZ: UTC

jobs:
  test:
    name: Validate, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: ${{ hashFiles('requirements.txt') != '' }}
        run: python -m pip install --requirement requirements.txt

      - name: Validate source provenance and records
        run: python scripts/validate.py

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build deterministic site output
        run: |
          rm -rf dist
          python scripts/build_site.py --output-dir dist --base-url https://yzc-666.github.io/ai-finance-radar/
