name: Update radar data

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-radar-data
  cancel-in-progress: false

env:
  LC_ALL: C.UTF-8
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  TZ: UTC
  AI_FINANCE_RADAR_USER_AGENT: "AI-Finance-Radar/1.0 (https://github.com/${{ github.repository }}; contact via repository issues)"

jobs:
  update:
    name: Refresh data
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: ${{ hashFiles('requirements.txt') != '' }}
        run: python -m pip install --requirement requirements.txt

      - name: Crawl configured sources
        run: python scripts/crawl.py

      - name: Validate source provenance and records
        run: python scripts/validate.py

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build deterministic site output
        run: |
          rm -rf dist
          python scripts/build_site.py --output-dir dist --base-url https://yzc-666.github.io/ai-finance-radar/

      - name: Commit refreshed data and generated output
        run: |
          git add -- data
          if git diff --cached --quiet; then
            echo "No data or generated changes to commit."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore(data): refresh radar data"
          git push
